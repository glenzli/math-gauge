[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-gauge"
version = "0.1.0"
description = "Weak-structure mathematical reasoning and formalization evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
math-gauge = "math_gauge.cli:main"

[tool.setuptools.packages.find]
include = ["math_gauge*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
